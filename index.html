<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Northstar Player — Web Prototype 0.8</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#22252c;--line:#30343d;--text:#f3f4f6;--muted:#9ba2ae;--accent:#f0a34a;--accent2:#ffd29a;--good:#65c995}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 13px;cursor:pointer}button:active{transform:scale(.98)}button.primary{background:var(--accent);color:#21170d;border-color:var(--accent);font-weight:700}button.ghost{background:transparent}button:disabled{opacity:.4;cursor:not-allowed}
header{height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#101114ed;backdrop-filter:blur(16px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:.2px}.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#ffc477,#d87926);display:grid;place-items:center;color:#25170a;font-weight:900}.version{font-size:11px;color:var(--muted);font-weight:500}
main{max-width:1120px;margin:auto;padding:22px 16px 50px}.intro{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.intro h1{font-size:25px;margin:0 0 3px}.intro p{color:var(--muted);margin:0;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.8fr);gap:16px;align-items:start}
.player-card,.library-card,.settings-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.player-card.is-visible{display:block}.screen{background:#050506;aspect-ratio:16/9;position:relative;display:grid;place-items:center}
video{width:100%;height:100%;object-fit:contain;background:#050506}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);pointer-events:none}
.empty .playmark{font-size:38px;color:var(--accent);margin-bottom:8px}.empty strong{display:block;color:var(--text);font-size:16px}
.player-meta{padding:14px 16px 10px}.now-title{font-size:16px;font-weight:700;overflow-wrap:anywhere}.now-sub{font-size:12px;color:var(--muted);margin-top:3px}
.timeline{padding:4px 16px 12px}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:7px 0;touch-action:pan-y}
.controls{display:flex;align-items:center;justify-content:center;gap:9px;padding:0 12px 15px;flex-wrap:wrap}.controls button{min-width:43px}.controls .mainplay{width:54px;height:46px;font-size:18px;border-radius:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 15px}.tools button{font-size:12px;padding:8px 10px}
.side{display:grid;gap:14px}.card-head{padding:15px 15px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}.card-head h2{font-size:15px;margin:0}.count{color:var(--muted);font-size:12px}
.library-actions{padding:0 14px 12px;display:flex;gap:8px}.library-actions button{flex:1;font-size:12px}.search{padding:0 14px 12px}.search input{width:100%;background:#101216;border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--text);outline:none}
.file-list{max-height:420px;overflow:auto;padding:0 8px 10px}.file{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent}.file:hover{background:#22252b}.file.active{background:#29251f;border-color:#70502e}.file-icon{width:38px;height:38px;border-radius:10px;background:#292d35;display:grid;place-items:center;color:var(--accent);flex:none}.file-info{min-width:0;flex:1}.file-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-detail{font-size:11px;color:var(--muted)}
.empty-list{padding:20px 14px;text-align:center;color:var(--muted);font-size:13px}
.settings-card{padding:14px 15px}.settings-card h2{font-size:14px;margin:0 0 10px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:13px}.setting-row span{color:var(--muted)}select{background:#252932;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px}

select{appearance:none;-webkit-appearance:none;background-color:#20242c!important;color:var(--text)!important;border:1px solid #3b414c!important;border-radius:11px!important;padding:10px 34px 10px 12px!important;font:600 12px system-ui!important;background-image:linear-gradient(45deg,transparent 50%,#f0a34a 50%),linear-gradient(135deg,#f0a34a 50%,transparent 50%)!important;background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%!important;background-size:5px 5px,5px 5px!important;background-repeat:no-repeat!important;min-height:40px}
.player-card .controls button{background:#252a33;border-color:#414957;color:#f4f5f7}.player-card .controls button:disabled{opacity:.35}
.notice{margin-top:14px;border:1px solid #51402d;background:#211b14;color:#d9c4a8;padding:11px 13px;border-radius:12px;font-size:12px}
footer{max-width:1120px;margin:0 auto;padding:0 16px 24px;color:#727985;font-size:11px}
input[type=file]{display:none}

.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:0 14px 13px}
.stat{background:#111318;border:1px solid var(--line);border-radius:12px;padding:10px 8px;min-width:0}
.stat strong{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.library-toolbar{padding:0 14px 10px;position:relative}.library-toolbar input{width:100%;background:#101216;border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--text);outline:none}
.toolbar-row{display:flex;gap:8px;margin-top:8px}.toolbar-row select{flex:1;min-width:0}
.folder-summary{padding:0 10px 8px;display:grid;gap:6px}.folder-nav{display:flex;align-items:center;gap:10px;padding:0 12px 10px}.folder-nav span{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-chip{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#20232a;border:1px solid var(--line);border-radius:11px;padding:9px 10px;text-align:left;width:100%}
.folder-chip strong{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folder-chip span{font-size:10px;color:var(--muted);white-space:nowrap}
.file{cursor:pointer}.file-detail{overflow-wrap:anywhere}.file-path{font-size:10px;color:#818997;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.file-size{font-size:10px;color:var(--accent2);white-space:nowrap}
.library-footer{display:flex;gap:8px;padding:0 12px 10px}.library-footer button{flex:1;font-size:11px;padding:8px 6px}
.scan-status{padding:0 14px 13px;font-size:11px;color:var(--muted)}
.file-group-title{padding:10px 10px 5px;color:var(--accent2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.file-row{display:flex;align-items:center;gap:7px}
.details-btn{padding:6px 8px;font-size:11px;flex:none}
.detail-panel{margin:0 10px 8px;padding:10px;background:#111318;border:1px solid var(--line);border-radius:10px;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
@media(max-width:420px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.library-actions{flex-wrap:wrap}.library-actions button{min-width:0}}
@media(max-width:760px){main{padding:17px 12px 35px}.layout{grid-template-columns:1fr}.intro{align-items:start;flex-direction:column}.screen{aspect-ratio:16/9}.file-list{max-height:300px}.side{grid-template-columns:1fr}.controls{gap:7px}.controls button{padding:9px 11px}}

/* 0.5 library-first shell and custom player */
.player-card{display:none!important}
.player-card.is-visible{display:flex!important;position:fixed;inset:0;z-index:100;background:#08090c;border:0;border-radius:0;flex-direction:column;overflow:auto;padding:0;gap:0}
.player-topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #282d36;flex:none}
.player-top-title{font-size:10px;letter-spacing:2px;color:#aeb5c0;font-weight:800}
.player-card .screen{flex:1;min-height:0;aspect-ratio:auto;display:flex;align-items:center;justify-content:center}
.player-card .screen video{width:100%;height:100%;max-height:calc(100dvh - 245px);object-fit:contain}
.player-card .player-meta{padding:12px 18px 4px}
.player-card .timeline{padding:4px 18px 8px}
.player-card .controls{padding:4px 14px 14px;gap:12px}
.player-card .controls button{border-radius:50px;min-width:48px;height:44px;background:#1c222b;border:1px solid #39414e;font-weight:700}
.player-card .controls .mainplay{width:62px;height:54px;border-radius:19px;background:linear-gradient(145deg,#ffc477,#dc842e);color:#201407;border:0;font-size:21px}
.player-card .tools{justify-content:center;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.layout{display:block}.side{display:block}.library-card{width:100%;max-width:none}
.library-actions{padding-bottom:14px}.library-actions #scanBtn{max-width:220px}
.toolbar-row{align-items:center}.menu-trigger{flex:1;text-align:left;background:#20242c;border:1px solid #3b414c;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:650}
.view-toggle{display:flex;gap:3px;background:#14171d;border:1px solid #333a45;padding:3px;border-radius:10px}
.view-toggle button{padding:6px 10px;border:0;background:transparent;border-radius:7px;color:#9ba2ae}
.view-toggle button.selected{background:#343b47;color:#fff}
.receipt-menu{position:absolute;z-index:20;margin-top:5px;min-width:175px;max-width:calc(100vw - 36px);background:#f4f0e8;color:#25221d;border:1px solid #d3c9b8;border-radius:5px;box-shadow:0 12px 30px #0009;padding:7px 0;font-family:ui-monospace,SFMono-Regular,monospace;clip-path:polygon(0 0,100% 0,100% 96%,96% 100%,92% 96%,88% 100%,84% 96%,80% 100%,76% 96%,72% 100%,68% 96%,64% 100%,60% 96%,56% 100%,52% 96%,48% 100%,44% 96%,40% 100%,36% 96%,32% 100%,28% 96%,24% 100%,20% 96%,16% 100%,12% 96%,8% 100%,4% 96%,0 100%)}
#viewMenu{left:14px;top:100%}#sortMenu{left:calc(14px + 34%);top:100%}.library-actions{display:none!important}
.receipt-option{display:block;width:100%;border:0;border-radius:0;background:transparent;color:#28241e;text-align:left;padding:9px 13px;font:600 12px ui-monospace,monospace}
.receipt-option:after{content:'................................................................';display:block;color:#c9bda9;font-size:7px;letter-spacing:1px;overflow:hidden;white-space:nowrap;height:4px}
.receipt-option.chosen{background:#e7dece;color:#8b4c12}
.receipt-option.chosen:before{content:'✓  '}
.file-list.grid-mode{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-height:none}
.file-list.grid-mode .file{display:flex;flex-direction:column;align-items:stretch;gap:7px;background:#1c2027;border:1px solid #303640;padding:9px;min-width:0}
.file-list.grid-mode .file-icon{width:100%;height:auto;aspect-ratio:16/9;border-radius:9px;font-size:22px}
.file-list.grid-mode .file-info{width:100%}.file-list.grid-mode .file-name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:36px}
.file-list.grid-mode .file-path{font-size:9px}.file-list.grid-mode .file-size{font-size:10px}
.file-list.grid-mode .details-btn{width:100%}
body.player-open{overflow:hidden}
@media(max-width:420px){.file-list.grid-mode{grid-template-columns:repeat(2,minmax(0,1fr))}.player-card .screen video{max-height:calc(100dvh - 250px)}}


/* 0.6 library refinement */
.stats-toggle{width:calc(100% - 28px);margin:0 14px 8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;background:#14171d;border:1px solid #303641;border-radius:9px;color:#cbd0d8;font-size:11px;font-weight:700;text-align:left}
.stats-toggle span{font-size:17px;color:var(--accent);transition:transform .18s}
.stats-toggle[aria-expanded="false"] span{transform:rotate(-90deg)}
.stats-grid.is-collapsed{display:none}
.folder-summary,.file-list{max-height:340px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#596170 #171a20;border:1px solid #343a45;border-radius:13px;background:#14171c;margin:0 10px 10px;padding:9px}
.folder-summary:empty{display:none}
.file-list{padding:9px}
.folder-summary.grid-mode{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.folder-summary.grid-mode .folder-chip{min-height:104px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:7px;padding:10px;min-width:0}
.folder-summary.grid-mode .folder-chip strong{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px}
.folder-summary.grid-mode .folder-chip span{white-space:normal;font-size:10px}
.file-list.grid-mode{max-height:340px;overflow-y:auto}
.file-list.grid-mode .file{position:relative;min-height:145px;justify-content:flex-start}
.file-list.grid-mode .file-detail{font-size:10px}
.file-list.grid-mode .file-path,.file-list.grid-mode .file-size{display:none}
.file-list.grid-mode .file-name{min-height:32px;font-size:12px}
.file-list.grid-mode .file-icon{height:auto;min-height:72px;aspect-ratio:16/9}
.file-list.grid-mode .details-btn{width:auto;min-width:38px;align-self:stretch}
.file-list.grid-mode .file{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:6px}
.file-list.grid-mode .file-icon{grid-column:1/-1}
.file-list.grid-mode .file-info{grid-column:1;grid-row:2}
.file-list.grid-mode .details-btn{grid-column:2;grid-row:2}
.file-list.grid-mode .file-info .file-path{display:none}
.file-list.grid-mode .file-size{display:none}
.file-list.grid-mode .file.active{border-color:#9a6a37;background:#29251f}
.folder-summary.grid-mode .folder-chip{background:#1d222a}
@media(max-width:420px){.folder-summary.grid-mode{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* 0.8 final web validation bundle */
.file-thumb{width:100%;height:100%;object-fit:cover;border-radius:9px;background:#15181e;display:block}
.file-icon.has-thumb{padding:0;overflow:hidden;background:#15181e}
.file-icon .thumb-fallback{font-size:22px}
.favorite-btn{width:34px;height:34px;padding:0;border-radius:10px;color:#aeb5c0;background:#171a20;border:1px solid #343a45;font-size:17px;flex:none}
.favorite-btn.is-favorite{color:#ffc36f;border-color:#76552e;background:#2a2117}
.file-list.grid-mode .favorite-btn{position:absolute;right:8px;top:8px;z-index:1;background:#111a;color:#ffc36f}
.file-list.grid-mode .file{padding:8px}
.file-list.grid-mode .file-icon{width:100%;height:auto;min-height:86px;aspect-ratio:16/9}
.file-list.grid-mode .file-info{min-width:0}
.file-list.grid-mode .file-detail{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.library-toolbar .toolbar-row{margin-bottom:2px}
.folder-crumbs{display:flex;align-items:center;gap:5px;overflow-x:auto;white-space:nowrap;padding:0 14px 9px;scrollbar-width:none}
.folder-crumbs button{padding:4px 7px;font-size:11px;background:transparent;border:0;color:#b9c0ca;border-radius:7px}
.folder-crumbs button.current{color:var(--accent2);font-weight:700;background:#29231b}

</style>
</head>
<body>
<header>
</main>
<footer>Northstar is a working project name. Prototype 0.8 · Library finish is user-initiated. Playback positions and supported folder handles are stored locally on this device.</footer>
<script>
(() => {
 const $=id=>document.getElementById(id), video=$('video');
 let items=[],active=-1,urls=new Map(),subtitleUrl=null,seekDragging=false,folderHandles=[],currentFolder=null,viewMode='folders',sortMode='name',layoutMode='list';
 const FAVORITES_KEY='northstar-favorites-v1', PREFS_KEY='northstar-library-prefs-v1';
 let favorites=new Set();try{favorites=new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]'))}catch(e){}
 try{const p=JSON.parse(localStorage.getItem(PREFS_KEY)||'{}');viewMode=p.viewMode||viewMode;sortMode=p.sortMode||sortMode;layoutMode=p.layoutMode||layoutMode}catch(e){}
 function savePrefs(){try{localStorage.setItem(PREFS_KEY,JSON.stringify({viewMode,sortMode,layoutMode}))}catch(e){}}
 function saveFavorites(){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify([...favorites]))}catch(e){}}
 function favoriteKey(item){return item.path+'|'+item.file.size+'|'+item.file.lastModified}
 const DB='northstar-library-db', STORE='handles';
 const fmt=s=>{if(!Number.isFinite(s)||s<0)return '0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
 const humanSize=n=>{if(!Number.isFinite(n))return '—';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB'};
 const ext=f=>(f.name.split('.').pop()||'Unknown').toUpperCase();
 const isVideo=f=>f.type.startsWith('video/')||/\.(mkv|avi|mov|webm|mp4|m4v|3gp|mpeg|mpg|ts|m2ts|ogv|wmv|flv)$/i.test(f.name);
 const pathOf=f=>f.webkitRelativePath||f._northstarPath||f.name;
 const dbOpen=()=>new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(Error('IndexedDB unavailable'));const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
 async function saveHandle(handle){try{const db=await dbOpen();await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(handle,'lastFolder');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();return true}catch(e){return false}}
 async function getHandle(){try{const db=await dbOpen();const h=await new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get('lastFolder');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return h||null}catch(e){return null}}
 async function clearHandle(){try{const db=await dbOpen();await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete('lastFolder');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){}}
 function releaseUrls(){urls.forEach(u=>URL.revokeObjectURL(u));urls.clear()}

 const viewChoices=[['folders','By folder'],['all','All videos'],['favorites','Favorites'],['types','By file type']];
 const sortChoices=[['name','Name'],['size','Largest first'],['date','Newest first'],['duration','Longest first']];
 function fillReceipt(id,choices,current,apply){const box=$(id);box.innerHTML='';choices.forEach(([value,label])=>{const b=document.createElement('button');b.className='receipt-option'+(value===current?' chosen':'');b.textContent=label;b.onclick=()=>{apply(value);box.hidden=true;render()};box.append(b)})}
 function syncMenus(){ $('viewMenuBtn').textContent=viewChoices.find(x=>x[0]===viewMode)[1]+' ▾';$('sortMenuBtn').textContent=sortChoices.find(x=>x[0]===sortMode)[1]+' ▾';$('listViewBtn').classList.toggle('selected',layoutMode==='list');$('gridViewBtn').classList.toggle('selected',layoutMode==='grid'); }
 $('viewMenuBtn').onclick=()=>{$('sortMenu').hidden=true;fillReceipt('viewMenu',viewChoices,viewMode,v=>{viewMode=v;currentFolder=null;savePrefs();syncMenus()});$('viewMenu').hidden=!$('viewMenu').hidden};
 $('sortMenuBtn').onclick=()=>{$('viewMenu').hidden=true;fillReceipt('sortMenu',sortChoices,sortMode,v=>{sortMode=v;savePrefs();syncMenus()});$('sortMenu').hidden=!$('sortMenu').hidden};
 $('listViewBtn').onclick=()=>{layoutMode='list';savePrefs();syncMenus();render()};$('gridViewBtn').onclick=()=>{layoutMode='grid';savePrefs();syncMenus();render()};

 function render(){
  const q=$('search').value.trim().toLowerCase(),mode=viewMode,sort=sortMode;
  const folders=new Map();items.forEach(x=>{const parts=x.path.split('/');const folder=parts.length>1?parts.slice(0,-1).join('/'):'Device root';if(!folders.has(folder))folders.set(folder,{count:0,size:0});const v=folders.get(folder);v.count++;v.size+=x.file.size});
  const types=new Map();items.forEach(x=>types.set(ext(x.file),(types.get(ext(x.file))||0)+1));
  const total=items.reduce((n,x)=>n+x.file.size,0);
  $('count').textContent=items.length+' video'+(items.length===1?'':'s');
  $('statVideos').textContent=items.length.toLocaleString();$('statSize').textContent=humanSize(total);$('statFolders').textContent=folders.size.toLocaleString();$('statTypes').textContent=types.size.toLocaleString();
  $('folderSummary').innerHTML='';$('fileList').innerHTML='';$('folderSummary').classList.toggle('grid-mode',layoutMode==='grid');$('fileList').classList.toggle('grid-mode',layoutMode==='grid');syncMenus();
  $('folderNav').hidden=!(mode==='folders'&&currentFolder!==null);
  $('folderCrumb').textContent=currentFolder||'';
  let shown=items.map((x,i)=>({...x,index:i})).filter(x=>(x.file.name+' '+x.path).toLowerCase().includes(q));
  if(mode==='favorites')shown=shown.filter(x=>favorites.has(favoriteKey(x)));
  if(mode==='folders'&&currentFolder!==null)shown=shown.filter(x=>(x.path.includes('/')?x.path.split('/').slice(0,-1).join('/'):'Device root')===currentFolder);
  if(mode==='types'&&q)shown=shown.filter(x=>(x.file.name+' '+ext(x.file)).toLowerCase().includes(q));
  shown.sort((a,b)=>sort==='size'?b.file.size-a.file.size:sort==='date'?(b.file.lastModified||0)-(a.file.lastModified||0):sort==='duration'?(b.duration||0)-(a.duration||0):a.file.name.localeCompare(b.file.name));
  if(mode==='folders'&&currentFolder===null){
   [...folders.entries()].filter(([name])=>name.toLowerCase().includes(q)).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([name,v])=>{
    const b=document.createElement('button');b.className='folder-chip';const n=document.createElement('strong'),d=document.createElement('span');
    n.textContent='📁 '+name;d.textContent=v.count+' videos · '+humanSize(v.size);b.append(n,d);
    b.onclick=()=>{currentFolder=name;render()};$('folderSummary').append(b);
   });
   $('fileList').innerHTML='<div class="empty-list"></div>';return;
  }
  if(mode==='types'&&currentFolder===null){
   [...types.entries()].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([name,count])=>{const b=document.createElement('button');b.className='folder-chip';const n=document.createElement('strong'),d=document.createElement('span');n.textContent='▤ '+name;d.textContent=count+' videos';b.append(n,d);b.onclick=()=>{$('search').value=name.toLowerCase();render()};$('folderSummary').append(b)});
  }
  if(!shown.length){$('fileList').innerHTML='<div class="empty-list">'+(mode==='favorites'?'No favorites yet. Tap ☆ on a video to save it here.':(items.length?'No matching videos in this view.':'Your library is empty.<br>Scan a folder or add individual videos.'))+'</div>';return}
  shown.forEach(x=>{
   const parent=x.path.includes('/')?x.path.split('/').slice(0,-1).join('/'):'Device root';
   const row=document.createElement('div');row.className='file';
   const icon=document.createElement('div');icon.className='file-icon';icon.innerHTML='<span class="thumb-fallback">▶</span>';
   const info=document.createElement('div');info.className='file-info';
   const name=document.createElement('div');name.className='file-name';name.textContent=x.file.name;
   const detail=document.createElement('div');detail.className='file-detail';detail.textContent=(x.duration?fmt(x.duration)+' · ':'')+ext(x.file);
   const path=document.createElement('div');path.className='file-path';path.textContent=parent;
   info.append(name,detail,path);
   const size=document.createElement('div');size.className='file-size';size.textContent=humanSize(x.file.size);
   const play=document.createElement('button');play.className='details-btn';play.textContent='▶';play.setAttribute('aria-label','Play '+x.file.name);play.onclick=()=>load(x.index);
   const fav=document.createElement('button');fav.className='favorite-btn'+(favorites.has(favoriteKey(x))?' is-favorite':'');fav.textContent=favorites.has(favoriteKey(x))?'★':'☆';fav.setAttribute('aria-label','Toggle favorite');
   fav.onclick=e=>{e.stopPropagation();const k=favoriteKey(x);if(favorites.has(k))favorites.delete(k);else favorites.add(k);saveFavorites();render()};
   const detailBtn=document.createElement('button');detailBtn.className='details-btn';detailBtn.textContent='⋯';detailBtn.setAttribute('aria-label','File details');
   row.append(icon,info,size,fav,play,detailBtn);
   queueThumbnail(x,icon);
   row.onclick=e=>{if(e.target===detailBtn||e.target===play)return;load(x.index)};
   detailBtn.onclick=()=>{const old=row.nextElementSibling;if(old&&old.classList.contains('detail-panel')){old.remove();return}const panel=document.createElement('div');panel.className='detail-panel';panel.textContent='Folder: '+parent+' · File: '+x.file.name+' · Size: '+humanSize(x.file.size)+' · Type: '+ext(x.file)+' · Modified: '+(x.file.lastModified?new Date(x.file.lastModified).toLocaleString():'Unknown')+' · Duration: '+(x.duration?fmt(x.duration):'Not read yet');row.after(panel)};
   if(x.index===active)row.classList.add('active');$('fileList').append(row);
  });
 }

 const thumbObserver=('IntersectionObserver'in window)?new IntersectionObserver(entries=>{
  entries.forEach(entry=>{if(entry.isIntersecting){const el=entry.target;thumbObserver.unobserve(el);const idx=Number(el.dataset.thumbIndex);if(items[idx])makeThumbnail(items[idx],el)}})
 },{rootMargin:'180px'}):null;
 function queueThumbnail(item,el){
  const idx=Number.isInteger(item.index)?item.index:items.indexOf(item);el.dataset.thumbIndex=String(idx);
  if(thumbObserver)thumbObserver.observe(el);else makeThumbnail(item,el);
 }
 function makeThumbnail(item,el){
  if(el.dataset.thumbDone==='1')return;el.dataset.thumbDone='1';
  const temp=document.createElement('video');temp.muted=true;temp.preload='metadata';temp.playsInline=true;
  const url=URL.createObjectURL(item.file);let finished=false;
  const cleanup=()=>{if(finished)return;finished=true;temp.removeAttribute('src');temp.load();URL.revokeObjectURL(url)};
  const fallback=()=>{cleanup()};
  temp.onloadedmetadata=()=>{if(!Number.isFinite(temp.duration)||temp.duration<=0){fallback();return}try{temp.currentTime=Math.min(temp.duration*.12,8)}catch(e){fallback()}};
  temp.onseeked=()=>{try{const c=document.createElement('canvas');c.width=320;c.height=180;const ctx=c.getContext('2d');ctx.drawImage(temp,0,0,c.width,c.height);const img=document.createElement('img');img.className='file-thumb';img.alt='';img.src=c.toDataURL('image/jpeg',.68);el.innerHTML='';el.append(img)}catch(e){}finally{cleanup()}};
  temp.onerror=fallback;temp.src=url;temp.load();
 }
 function addFiles(files,source='Selected files'){
  let added=0;[...files].filter(isVideo).forEach(file=>{const path=pathOf(file);if(items.some(x=>x.path===path&&x.file.size===file.size&&x.file.lastModified===file.lastModified))return;items.push({file,path,duration:0});added++});
  $('scanStatus').textContent=source+': '+added+' new video(s), '+items.length+' total in this session.';render();
 }
 async function scanDirectory(handle){
  $('scanStatus').textContent='Scanning folder…';
  let count=0;const walk=async(dir,prefix='')=>{for await(const [name,entry] of dir.entries()){if(entry.kind==='directory'){await walk(entry,prefix+name+'/')}else if(entry.kind==='file'){const f=await entry.getFile();if(isVideo(f)){Object.defineProperty(f,'_northstarPath',{value:prefix+name,configurable:true});const path=prefix+name;if(!items.some(x=>x.path===path&&x.file.size===f.size&&x.file.lastModified===f.lastModified)){items.push({file:f,path,duration:0});count++}}}}};
  try{await walk(handle);folderHandles=[handle];await saveHandle(handle);$('scanStatus').textContent='Scan complete: '+count+' new video(s). '+items.length+' total. Folder handle saved on this browser where supported.';render()}
  catch(e){$('scanStatus').textContent='Folder scan stopped: '+e.message}
 }
 async function chooseFolder(){
  if('showDirectoryPicker'in window){try{const h=await window.showDirectoryPicker({mode:'read'});const p=await h.requestPermission({mode:'read'});if(p!=='granted'){ $('scanStatus').textContent='Folder permission was not granted.';return}await scanDirectory(h);return}catch(e){if(e.name==='AbortError')return;$('scanStatus').textContent='Folder picker unavailable here. Trying the browser folder selector…'}}
  $('folderInput').click();
 }
 async function restoreFolder(){
  const h=await getHandle();if(!h){$('scanStatus').textContent='No saved folder handle. Tap Scan folder to choose a folder.';return}
  try{let p=await h.queryPermission({mode:'read'});if(p!=='granted')p=await h.requestPermission({mode:'read'});if(p==='granted'){await scanDirectory(h)}else $('scanStatus').textContent='Chrome needs you to grant folder access again. Tap Scan folder.'}
  catch(e){$('scanStatus').textContent='Saved folder access needs to be reselected. Tap Scan folder.'}
 }
 function load(i){
  if(i<0||i>=items.length)return;
  if(active>=0&&$('remember').checked&&Number.isFinite(video.currentTime)){try{localStorage.setItem('northstar:'+items[active].path+':'+items[active].file.size+':'+items[active].file.lastModified,String(video.currentTime))}catch(e){}}
  active=i;$('playerCard').classList.add('is-visible');document.body.classList.add('player-open');$('prevVideo').disabled=(i===0);$('nextVideo').disabled=(i===items.length-1);const item=items[i];if(!urls.has(i))urls.set(i,URL.createObjectURL(item.file));
  video.src=urls.get(i);$('subtitleBtn').dataset.externalLoaded='';$('subtitleBtn').textContent='Checking subtitles…';video.load();$('empty').style.display='none';$('nowTitle').textContent=item.file.name;$('nowSub').textContent=humanSize(item.file.size)+' · '+item.path;$('play').textContent='▶';render();
  video.onloadedmetadata=()=>{item.duration=video.duration;$('duration').textContent=fmt(video.duration);refreshSubtitleTracks();if($('remember').checked){let t=0;try{t=Number(localStorage.getItem('northstar:'+item.path+':'+item.file.size+':'+item.file.lastModified)||0)}catch(e){}if(t>5&&t<video.duration-5)video.currentTime=t}render()};
  video.play().then(()=>$('play').textContent='Ⅱ').catch(()=>$('play').textContent='▶');
 }
 function toggle(){if(!video.src)return;if(video.paused)video.play().then(()=>$('play').textContent='Ⅱ').catch(()=>{});else{video.pause();$('play').textContent='▶'}}
 function seek(delta){if(video.src&&Number.isFinite(video.duration))video.currentTime=Math.max(0,Math.min(video.duration,video.currentTime+delta))}
 $('scanBtn').onclick=$('scanTop').onclick=chooseFolder;$('rescanBtn').onclick=chooseFolder;
 $('videoInput').onchange=e=>{addFiles(e.target.files);e.target.value=''};
 $('folderInput').onchange=e=>{addFiles(e.target.files,'Folder selection');e.target.value=''};
 $('clearBtn').onclick=()=>{if(active>=0)video.pause();if(thumbObserver)thumbObserver.disconnect();items=[];active=-1;$('playerCard').classList.remove('is-visible');document.body.classList.remove('player-open');releaseUrls();video.removeAttribute('src');video.load();$('empty').style.display='grid';$('nowTitle').textContent='No video selected';$('nowSub').textContent='Your selected video will appear here';$('play').textContent='▶';$('seek').value=0;$('currentTime').textContent='0:00';$('duration').textContent='0:00';$('scanStatus').textContent='Library cleared from this session. Saved folder permission is unchanged.';render()};
 $('statsToggle').onclick=()=>{const collapsed=$('statsGrid').classList.toggle('is-collapsed');$('statsToggle').setAttribute('aria-expanded',String(!collapsed));$('statsChevron').textContent=collapsed?'›':'⌄'};
 $('search').oninput=render;$('folderBack').onclick=()=>{currentFolder=null;render()};
 $('closePlayer').onclick=()=>{video.pause();$('playerCard').classList.remove('is-visible');document.body.classList.remove('player-open')};$('play').onclick=toggle;$('back').onclick=()=>seek(-10);$('forward').onclick=()=>seek(10);
 $('prevVideo').onclick=()=>{if(active>0)load(active-1)};
 $('nextVideo').onclick=()=>{if(active>=0&&active<items.length-1)load(active+1)};

 video.addEventListener('timeupdate',()=>{if(!seekDragging&&video.duration){$('seek').value=video.currentTime/video.duration*1000;$('currentTime').textContent=fmt(video.currentTime)}});
 video.addEventListener('durationchange',()=>{$('duration').textContent=fmt(video.duration)});
 video.addEventListener('play',()=>$('play').textContent='Ⅱ');video.addEventListener('pause',()=>$('play').textContent='▶');
 video.addEventListener('ended',()=>{if(active+1<items.length)load(active+1)});
 $('seek').oninput=()=>{seekDragging=true;if(video.duration){video.currentTime=Number($('seek').value)/1000*video.duration;$('currentTime').textContent=fmt(video.currentTime)}};
 $('seek').onchange=()=>seekDragging=false;
 $('speed').onchange=()=>{video.playbackRate=Number($('speed').value);$('speedBtn').textContent='Speed '+$('speed').value+'×'};
 $('speedBtn').onclick=()=>{const opts=[.5,.75,1,1.25,1.5,1.75,2],idx=opts.indexOf(video.playbackRate);const n=opts[(idx+1)%opts.length];video.playbackRate=n;$('speed').value=String(n);$('speedBtn').textContent='Speed '+n+'×'};
 $('fit').onchange=()=>video.style.objectFit=$('fit').value;
 function refreshSubtitleTracks(){
  const tracks=[...video.textTracks];const usable=tracks.filter(t=>t.kind==='subtitles'||t.kind==='captions');
  const activeTrack=usable.findIndex(t=>t.mode==='showing');
  if(usable.length){$('subtitleBtn').textContent=activeTrack>=0?'Subtitle: '+(usable[activeTrack].label||'Track '+(activeTrack+1)):'Subtitles: '+usable.length+' track(s)';}
  else if(!$('subtitleBtn').dataset.externalLoaded){$('subtitleBtn').textContent='Load subtitles';}
 }
 $('subtitleBtn').onclick=()=>{
  const tracks=[...video.textTracks].filter(t=>t.kind==='subtitles'||t.kind==='captions');
  if(tracks.length){
   const current=tracks.findIndex(t=>t.mode==='showing');
   const next=(current+1)% (tracks.length+1);
   tracks.forEach((t,i)=>t.mode=(next===0?'disabled':(i===next-1?'showing':'disabled')));
   $('subtitleBtn').textContent=next===0?'Subtitles off':'Subtitle: '+(tracks[next-1].label||'Track '+next);
  }else $('subtitleInput').click();
 };
 $('subtitleInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;let t=await f.text();if(f.name.toLowerCase().endsWith('.srt'))t='WEBVTT\\n\\n'+t.replace(/,(\\d{3})/g,'.$1');if(!t.trimStart().startsWith('WEBVTT'))t='WEBVTT\\n\\n'+t;const blob=new Blob([t],{type:'text/vtt'});if(subtitleUrl)URL.revokeObjectURL(subtitleUrl);subtitleUrl=URL.createObjectURL(blob);video.querySelectorAll('track').forEach(x=>x.remove());const tr=document.createElement('track');tr.kind='subtitles';tr.label=f.name;tr.srclang='en';tr.src=subtitleUrl;tr.default=true;video.append(tr);$('subtitleBtn').dataset.externalLoaded='1';$('subtitleBtn').textContent='Subtitles loaded';tr.addEventListener('load',refreshSubtitleTracks);e.target.value=''};
 $('pipBtn').onclick=async()=>{try{if(document.pictureInPictureElement)await document.exitPictureInPicture();else if(document.pictureInPictureEnabled&&video.readyState>=1)await video.requestPictureInPicture();else alert('Picture-in-Picture is not available in this browser context.')}catch(e){alert('Picture-in-Picture could not start: '+e.message)}};
 $('fullBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('screen').requestFullscreen()}catch(e){alert('Fullscreen is not available: '+e.message)}};
 $('aboutBtn').onclick=()=>alert('Northstar Player · Web Prototype 0.2\\nSmart local media library experiment. Folder scanning depends on browser support.');
 video.addEventListener('error',()=>{if(video.error&&video.src)$('nowSub').textContent='This browser could not play this file. It may use an unsupported codec or container.'});
 let lastTap=0,lastX=0;$('screen').addEventListener('pointerup',e=>{if(e.pointerType!=='touch'||!video.src)return;const now=Date.now(),r=$('screen').getBoundingClientRect(),x=e.clientX-r.left;if(now-lastTap<320&&Math.abs(x-lastX)<90){if(x<r.width*.35)seek(-10);else if(x>r.width*.65)seek(10)}lastTap=now;lastX=x});
 window.addEventListener('pagehide',()=>{if(active>=0&&$('remember').checked&&Number.isFinite(video.currentTime)){try{localStorage.setItem('northstar:'+items[active].path+':'+items[active].file.size+':'+items[active].file.lastModified,String(video.currentTime))}catch(e){}}releaseUrls();if(subtitleUrl)URL.revokeObjectURL(subtitleUrl)});
 savePrefs();syncMenus();render();$('prevVideo').disabled=true;$('nextVideo').disabled=true;restoreFolder();
})();
</script>
